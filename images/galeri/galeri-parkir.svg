<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" role="img" aria-label="Foto area parkir motor beratap Kost Ramzah">
  <defs>
    <linearGradient id="gpWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FA"/>
      <stop offset="100%" stop-color="#E2E7EC"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#gpWall)"/>
  <!-- Kanopi / Atap Parkiran -->
  <polygon points="0,60 600,30 600,70 0,100" fill="#2C353F"/>
  <!-- Tiang Penyangga Besi -->
  <rect x="60" y="80" width="12" height="340" fill="#181C20"/>
  <rect x="290" y="70" width="12" height="350" fill="#181C20"/>
  <rect x="520" y="55" width="12" height="365" fill="#181C20"/>
  <!-- Lantai Paving Semen Bersih -->
  <rect y="320" width="600" height="130" fill="#CBD5DF"/>
  <line x1="0" y1="360" x2="600" y2="360" stroke="#B8C5D0" stroke-width="2"/>
  <line x1="0" y1="400" x2="600" y2="400" stroke="#B8C5D0" stroke-width="2"/>
  <!-- Garis Parkir Kuning Rapi -->
  <rect x="110" y="340" width="8" height="90" rx="2" fill="#F6E05E"/>
  <rect x="220" y="340" width="8" height="90" rx="2" fill="#F6E05E"/>
  <rect x="330" y="340" width="8" height="90" rx="2" fill="#F6E05E"/>
  <rect x="440" y="340" width="8" height="90" rx="2" fill="#F6E05E"/>
  <!-- Siluet Motor Parkir -->
  <circle cx="165" cy="380" r="28" fill="#4A5568"/>
  <circle cx="275" cy="380" r="28" fill="#4A5568"/>
  <circle cx="385" cy="380" r="28" fill="#4A5568"/>
  <circle cx="495" cy="380" r="28" fill="#4A5568"/>
  <!-- Label Banner -->
  <rect x="30" y="390" width="180" height="32" rx="4" fill="#2C353F"/>
  <text x="120" y="411" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Parkir Motor Beratap</text>
</svg>
