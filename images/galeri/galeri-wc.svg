<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" role="img" aria-label="Foto kamar mandi dan WC jongkok bersih Kost Ramzah">
  <defs>
    <linearGradient id="gwcWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8ECEF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#gwcWall)"/>
  <!-- Keramik Bersih -->
  <line x1="0" y1="100" x2="600" y2="100" stroke="#DFE5EB" stroke-width="1.5"/>
  <line x1="0" y1="200" x2="600" y2="200" stroke="#DFE5EB" stroke-width="1.5"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="#DFE5EB" stroke-width="1.5"/>
  <!-- Bak Air / Ember Mandi & Gayung -->
  <rect x="80" y="220" width="160" height="180" rx="4" fill="#2C353F"/>
  <rect x="75" y="215" width="170" height="15" rx="2" fill="#3A4652"/>
  <circle cx="160" cy="222" r="60" fill="#718096" opacity="0.3"/>
  <!-- Kran Air Bersih -->
  <path d="M 160 215 L 160 170 Q 160 155 145 155 L 135 155" fill="none" stroke="#CBD5DF" stroke-width="6" stroke-linecap="round"/>
  <!-- Area WC Jongkok Bersih -->
  <rect x="340" y="260" width="180" height="140" rx="8" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="2"/>
  <ellipse cx="430" cy="330" rx="45" ry="35" fill="#EDF0F3" stroke="#CBD5DF" stroke-width="2"/>
  <ellipse cx="430" cy="335" rx="22" ry="16" fill="#A0AEC0"/>
  <!-- Pijakan Kaki WC Jongkok Rapi -->
  <line x1="365" y1="310" x2="365" y2="350" stroke="#CBD5DF" stroke-width="3"/>
  <line x1="375" y1="310" x2="375" y2="350" stroke="#CBD5DF" stroke-width="3"/>
  <line x1="485" y1="310" x2="485" y2="350" stroke="#CBD5DF" stroke-width="3"/>
  <line x1="495" y1="310" x2="495" y2="350" stroke="#CBD5DF" stroke-width="3"/>
  <!-- Label Banner -->
  <rect x="30" y="390" width="190" height="32" rx="4" fill="#2C353F"/>
  <text x="125" y="411" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Kamar Mandi &amp; WC Bersih</text>
</svg>
