<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" role="img" aria-label="Foto dapur bersama Kost Ramzah yang bersih dan terawat">
  <defs>
    <linearGradient id="gdWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F4F7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#gdWall)"/>
  <!-- Keramik Dinding Dapur -->
  <line x1="0" y1="120" x2="600" y2="120" stroke="#DFE5EB" stroke-width="1.5"/>
  <line x1="0" y1="180" x2="600" y2="180" stroke="#DFE5EB" stroke-width="1.5"/>
  <line x1="0" y1="240" x2="600" y2="240" stroke="#DFE5EB" stroke-width="1.5"/>
  <!-- Meja Dapur / Kitchen Counter -->
  <rect y="260" width="600" height="190" fill="#2C353F"/>
  <rect y="250" width="600" height="15" fill="#E2E8F0" rx="2"/>
  <!-- Kompor Gas 2 Tungku -->
  <rect x="80" y="235" width="160" height="25" rx="3" fill="#181C20"/>
  <circle cx="120" cy="247" r="14" fill="#3A4652" stroke="#4A5568" stroke-width="2"/>
  <circle cx="200" cy="247" r="14" fill="#3A4652" stroke="#4A5568" stroke-width="2"/>
  <!-- Tempat Cuci Piring (Wastafel / Sink) -->
  <rect x="340" y="240" width="180" height="20" rx="3" fill="#A0AEC0"/>
  <!-- Kran Air Metal -->
  <path d="M 430 240 L 430 190 Q 430 170 410 170 L 400 170" fill="none" stroke="#CBD5DF" stroke-width="6" stroke-linecap="round"/>
  <!-- Rak Piring Atas -->
  <rect x="80" y="50" width="440" height="60" rx="3" fill="#B8977E" stroke="#8C6549" stroke-width="2"/>
  <line x1="220" y1="50" x2="220" y2="110" stroke="#8C6549" stroke-width="1.5"/>
  <line x1="360" y1="50" x2="360" y2="110" stroke="#8C6549" stroke-width="1.5"/>
  <!-- Label Banner -->
  <rect x="30" y="390" width="190" height="32" rx="4" fill="#181C20"/>
  <text x="125" y="411" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Dapur Bersama Bersih</text>
</svg>
