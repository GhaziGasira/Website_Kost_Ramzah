<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" role="img" aria-label="Foto suasana kebersamaan anak kost santai di teras Kost Ramzah">
  <defs>
    <linearGradient id="gkeg1Sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#F7F8FA"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#gkeg1Sky)"/>
  <!-- Dinding Teras & Pagar Asri -->
  <rect y="100" width="600" height="240" fill="#EDF0F3"/>
  <rect y="320" width="600" height="130" fill="#DFE5EB"/>
  <!-- Tanaman Pot Hijau Asri -->
  <circle cx="90" cy="280" r="40" fill="#2D7A5C"/>
  <circle cx="510" cy="280" r="40" fill="#2D7A5C"/>
  <rect x="75" y="300" width="30" height="30" rx="3" fill="#8C6549"/>
  <rect x="495" y="300" width="30" height="30" rx="3" fill="#8C6549"/>
  <!-- Meja Teras & Kursi Santai -->
  <rect x="230" y="270" width="140" height="80" rx="4" fill="#B8977E" stroke="#8C6549" stroke-width="2"/>
  <!-- Kursi Santai Kiri -->
  <rect x="170" y="250" width="45" height="100" rx="3" fill="#2C353F"/>
  <!-- Kursi Santai Kanan -->
  <rect x="385" y="250" width="45" height="100" rx="3" fill="#2C353F"/>
  <!-- Cangkir & Buku di Atas Meja -->
  <circle cx="270" cy="260" r="8" fill="#FFFFFF"/>
  <rect x="310" y="255" width="35" height="18" rx="2" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1"/>
  <!-- Label Banner -->
  <rect x="30" y="390" width="190" height="32" rx="4" fill="#2C353F"/>
  <text x="125" y="411" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Suasana Santai di Teras</text>
</svg>
