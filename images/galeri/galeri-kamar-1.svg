<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" role="img" aria-label="Foto suasana kamar Kost Ramzah dengan kasur dan meja belajar">
  <defs>
    <linearGradient id="gk1Wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F4F7"/>
    </linearGradient>
    <linearGradient id="gk1Floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E7EC"/>
      <stop offset="100%" stop-color="#D5DCE2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#gk1Wall)"/>
  <rect y="340" width="600" height="110" fill="url(#gk1Floor)"/>
  <!-- Jendela Kamar -->
  <rect x="50" y="60" width="140" height="200" rx="3" fill="#EBF4F6" stroke="#CBD5DF" stroke-width="2"/>
  <line x1="120" y1="60" x2="120" y2="260" stroke="#CBD5DF" stroke-width="2"/>
  <line x1="50" y1="160" x2="190" y2="160" stroke="#CBD5DF" stroke-width="2"/>
  <!-- Kasur & Bantal -->
  <rect x="220" y="220" width="340" height="140" rx="6" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="2"/>
  <rect x="240" y="180" width="100" height="45" rx="6" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/>
  <rect x="360" y="180" width="100" height="45" rx="6" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/>
  <rect x="220" y="270" width="340" height="90" rx="4" fill="#2C353F"/>
  <!-- Meja Belajar Kecil -->
  <rect x="50" y="270" width="130" height="100" rx="3" fill="#B8977E" stroke="#8C6549" stroke-width="1.5"/>
  <rect x="80" y="235" width="50" height="35" rx="2" fill="#2C353F"/>
  <!-- Label Banner -->
  <rect x="30" y="390" width="170" height="32" rx="4" fill="#2C353F"/>
  <text x="115" y="411" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sudut Kamar Tidur</text>
</svg>
