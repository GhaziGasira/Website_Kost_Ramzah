<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" role="img" aria-label="Ilustrasi interior kamar Kost Ramzah dengan kasur dan lemari pakaian">
  <defs>
    <linearGradient id="roomWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F4F7"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E7EC"/>
      <stop offset="100%" stop-color="#D5DCE2"/>
    </linearGradient>
    <linearGradient id="bedSheet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8ECEF"/>
    </linearGradient>
    <linearGradient id="bedBlanket" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A4652"/>
      <stop offset="100%" stop-color="#2C353F"/>
    </linearGradient>
    <linearGradient id="wardrobeWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8977E"/>
      <stop offset="100%" stop-color="#9C7A62"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4F6"/>
      <stop offset="100%" stop-color="#DAE7EC"/>
    </linearGradient>
  </defs>

  <!-- Latar Dinding Kamar Bersih & Terang -->
  <rect width="800" height="440" fill="url(#roomWall)"/>

  <!-- Garis Pertemuan Dinding & Lantai -->
  <line x1="0" y1="440" x2="800" y2="440" stroke="#CBD5DF" stroke-width="2"/>
  <rect y="432" width="800" height="8" fill="#DFE5EB"/>

  <!-- Lantai Kamar Keramik Bersih -->
  <rect y="440" width="800" height="160" fill="url(#floorGrad)"/>
  <!-- Garis Keramik Lantai Bersih -->
  <line x1="0" y1="495" x2="800" y2="495" stroke="#CAD3DC" stroke-width="1.5"/>
  <line x1="0" y1="550" x2="800" y2="550" stroke="#CAD3DC" stroke-width="1.5"/>
  <line x1="160" y1="440" x2="110" y2="600" stroke="#CAD3DC" stroke-width="1.5"/>
  <line x1="340" y1="440" x2="310" y2="600" stroke="#CAD3DC" stroke-width="1.5"/>
  <line x1="520" y1="440" x2="510" y2="600" stroke="#CAD3DC" stroke-width="1.5"/>
  <line x1="700" y1="440" x2="710" y2="600" stroke="#CAD3DC" stroke-width="1.5"/>

  <!-- Jendela Kamar Besar (Sirkulasi Udara & Cahaya Alami) -->
  <rect x="80" y="80" width="220" height="260" rx="3" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="3"/>
  <rect x="90" y="90" width="95" height="240" fill="url(#windowLight)"/>
  <rect x="195" y="90" width="95" height="240" fill="url(#windowLight)"/>
  <line x1="80" y1="210" x2="300" y2="210" stroke="#CBD5DF" stroke-width="2"/>
  <!-- Bayangan Sinar Matahari Masuk dari Jendela -->
  <polygon points="120,440 280,440 380,560 170,560" fill="#FFFBEB" opacity="0.45"/>

  <!-- Gorden Minimalis Abu Rapi di Sisi Jendela -->
  <rect x="65" y="70" width="250" height="8" rx="2" fill="#2C353F"/>
  <rect x="68" y="78" width="22" height="280" rx="2" fill="#717D8A"/>
  <rect x="290" y="78" width="22" height="280" rx="2" fill="#717D8A"/>

  <!-- Lemari Pakaian Kayu Minimalis (Fasilitas Kamar) -->
  <rect x="580" y="100" width="160" height="360" rx="4" fill="url(#wardrobeWood)" stroke="#7D5F4A" stroke-width="2"/>
  <!-- Garis Pintu Lemari 2 Pintu -->
  <line x1="660" y1="100" x2="660" y2="460" stroke="#7D5F4A" stroke-width="2"/>
  <!-- Handle Pintu Lemari Metal Minimalis -->
  <rect x="646" y="260" width="6" height="40" rx="2" fill="#2C353F"/>
  <rect x="668" y="260" width="6" height="40" rx="2" fill="#2C353F"/>
  <!-- Laci Bawah Lemari -->
  <line x1="580" y1="410" x2="740" y2="410" stroke="#7D5F4A" stroke-width="1.5"/>
  <rect x="645" y="425" width="30" height="5" rx="1.5" fill="#2C353F"/>
  <!-- Kaki Lemari -->
  <rect x="590" y="460" width="16" height="15" fill="#5E4636"/>
  <rect x="714" y="460" width="16" height="15" fill="#5E4636"/>

  <!-- Tempat Tidur / Kasur Empuk (Fasilitas Kamar) -->
  <!-- Headboard / Sandaran Kasur Kayu -->
  <rect x="240" y="240" width="320" height="180" rx="6" fill="#8E725D" stroke="#6F5644" stroke-width="2"/>
  
  <!-- Rangka Dipan Bawah -->
  <rect x="220" y="400" width="360" height="60" rx="4" fill="#6F5644"/>
  <!-- Kaki Dipan -->
  <rect x="235" y="460" width="22" height="20" fill="#4E3B2D"/>
  <rect x="543" y="460" width="22" height="20" fill="#4E3B2D"/>

  <!-- Kasur & Sprei Bersih Rapi -->
  <rect x="230" y="340" width="340" height="80" rx="6" fill="url(#bedSheet)" stroke="#CBD5DF" stroke-width="1.5"/>

  <!-- Bantal Empuk Rapi -->
  <rect x="270" y="295" width="115" height="55" rx="8" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/>
  <rect x="415" y="295" width="115" height="55" rx="8" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/>

  <!-- Selimut Abu Charcoal Elegan (Sesuai Palet Desain) -->
  <rect x="230" y="380" width="340" height="70" rx="4" fill="url(#bedBlanket)"/>
  <!-- Lipatan Selimut Atas -->
  <rect x="230" y="370" width="340" height="15" rx="2" fill="#4A5764"/>

  <!-- Meja Samping Kecil (Nakas) -->
  <rect x="180" y="380" width="55" height="80" rx="3" fill="#A18169" stroke="#7D5F4A" stroke-width="1.5"/>
  <rect x="195" y="405" width="25" height="4" rx="1" fill="#2C353F"/>
  <!-- Lampu Tidur Minimalis di Atas Nakas -->
  <polygon points="195,355 220,355 225,378 190,378" fill="#FFFBEB" stroke="#DFE5EB" stroke-width="1"/>
  <line x1="207" y1="378" x2="207" y2="380" stroke="#2C353F" stroke-width="2.5"/>

  <!-- Stop Kontak / Colokan Listrik Dinding (Kenyamanan Belajar Mahasiswa) -->
  <rect x="545" y="330" width="24" height="24" rx="3" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/>
  <circle cx="553" cy="342" r="2.5" fill="#4A5568"/>
  <circle cx="561" cy="342" r="2.5" fill="#4A5568"/>

  <!-- Hiasan Dinding Minimalis Frame Foto -->
  <rect x="360" y="110" width="80" height="100" rx="2" fill="#FFFFFF" stroke="#2C353F" stroke-width="2"/>
  <rect x="368" y="118" width="64" height="84" fill="#EDF0F3"/>
  <circle cx="400" cy="150" r="14" fill="#A0AEC0"/>
</svg>
