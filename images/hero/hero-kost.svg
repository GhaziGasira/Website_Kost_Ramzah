<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" role="img" aria-label="Ilustrasi tampak depan Kost Ramzah yang bersih dan asri">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9ECEF"/>
      <stop offset="100%" stop-color="#F7F8FA"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F5F3"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C29B7F"/>
      <stop offset="100%" stop-color="#A87F63"/>
    </linearGradient>
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D7A5C"/>
      <stop offset="100%" stop-color="#1A533E"/>
    </linearGradient>
  </defs>

  <!-- Latar Langit Cerah -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Cahaya Matahari Pagi Lembut -->
  <circle cx="680" cy="120" r="80" fill="#FFF8E7" opacity="0.6"/>

  <!-- Halaman & Rumput Bersih -->
  <rect y="460" width="800" height="140" fill="#E2EBE5"/>
  <rect y="490" width="800" height="110" fill="#D3E0D8"/>

  <!-- Jalan Setapak Masuk -->
  <polygon points="340,600 460,600 430,480 370,480" fill="#C5D3CB"/>

  <!-- Bangunan Utama Kost 2 Lantai -->
  <rect x="180" y="160" width="440" height="320" rx="4" fill="url(#wallGrad)" stroke="#D8E2DC" stroke-width="2"/>

  <!-- Atap / Kanopi Minimalis Lantai 2 -->
  <polygon points="160,160 640,160 620,135 180,135" fill="#2E3D36"/>
  <rect x="160" y="155" width="480" height="8" fill="#2C353F"/>

  <!-- Balkon Lantai 2 -->
  <rect x="220" y="190" width="160" height="90" rx="3" fill="#EBF2ED" stroke="#CBD8D0" stroke-width="1.5"/>
  <line x1="300" y1="190" x2="300" y2="280" stroke="#CBD8D0" stroke-width="1.5"/>
  <!-- Jendela Kamar Lantai 2 Kiri -->
  <rect x="235" y="200" width="50" height="70" fill="#78A693" opacity="0.4"/>
  <rect x="315" y="200" width="50" height="70" fill="#78A693" opacity="0.4"/>

  <!-- Pintu Balkon Kanan Lantai 2 -->
  <rect x="420" y="190" width="160" height="90" rx="3" fill="#EBF2ED" stroke="#CBD8D0" stroke-width="1.5"/>
  <line x1="500" y1="190" x2="500" y2="280" stroke="#CBD8D0" stroke-width="1.5"/>
  <rect x="435" y="200" width="50" height="70" fill="#78A693" opacity="0.4"/>
  <rect x="515" y="200" width="50" height="70" fill="#78A693" opacity="0.4"/>

  <!-- Railing Balkon Minimalis -->
  <rect x="210" y="275" width="380" height="8" fill="#3A4D44"/>
  <line x1="230" y1="283" x2="230" y2="305" stroke="#3A4D44" stroke-width="2.5"/>
  <line x1="280" y1="283" x2="280" y2="305" stroke="#3A4D44" stroke-width="2.5"/>
  <line x1="330" y1="283" x2="330" y2="305" stroke="#3A4D44" stroke-width="2.5"/>
  <line x1="380" y1="283" x2="380" y2="305" stroke="#3A4D44" stroke-width="2.5"/>
  <line x1="430" y1="283" x2="430" y2="305" stroke="#3A4D44" stroke-width="2.5"/>
  <line x1="480" y1="283" x2="480" y2="305" stroke="#3A4D44" stroke-width="2.5"/>
  <line x1="530" y1="283" x2="530" y2="305" stroke="#3A4D44" stroke-width="2.5"/>
  <line x1="580" y1="283" x2="580" y2="305" stroke="#3A4D44" stroke-width="2.5"/>
  <rect x="210" y="303" width="380" height="4" fill="#3A4D44"/>

  <!-- Lantai 1: Teras & Pintu Masuk Utama -->
  <!-- Kanopi Teras Lantai 1 -->
  <rect x="320" y="340" width="160" height="10" fill="#2E3D36"/>
  <!-- Pintu Utama Kayu Hangat -->
  <rect x="355" y="350" width="90" height="130" fill="url(#woodGrad)" stroke="#8C6549" stroke-width="2"/>
  <rect x="365" y="365" width="30" height="45" fill="#E8F1EC" opacity="0.3"/>
  <rect x="405" y="365" width="30" height="45" fill="#E8F1EC" opacity="0.3"/>
  <circle cx="370" cy="425" r="3.5" fill="#F4E8D0"/>

  <!-- Jendela Kamar Lantai 1 Kiri -->
  <rect x="220" y="360" width="90" height="85" fill="#EBF2ED" stroke="#CBD8D0" stroke-width="1.5"/>
  <rect x="230" y="370" width="70" height="65" fill="#78A693" opacity="0.35"/>
  <line x1="265" y1="360" x2="265" y2="445" stroke="#CBD8D0" stroke-width="1.5"/>

  <!-- Jendela Kamar Lantai 1 Kanan -->
  <rect x="490" y="360" width="90" height="85" fill="#EBF2ED" stroke="#CBD8D0" stroke-width="1.5"/>
  <rect x="500" y="370" width="70" height="65" fill="#78A693" opacity="0.35"/>
  <line x1="535" y1="360" x2="535" y2="445" stroke="#CBD8D0" stroke-width="1.5"/>

  <!-- Papan Nama Elegan "KOST RAMZAH" -->
  <g transform="translate(330, 290)">
    <rect width="140" height="34" rx="4" fill="#2C353F" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="70" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">KOST RAMZAH</text>
  </g>

  <!-- CCTV Indicator di Sudut Teras -->
  <circle cx="340" cy="345" r="5" fill="#333333"/>
  <rect x="337" y="347" width="10" height="5" rx="1" fill="#444444" transform="rotate(30 337 347)"/>
  <circle cx="342" cy="349" r="1.5" fill="#25D366"/>

  <!-- Tanaman Asri & Pot Bunga (Sentuhan Hangat) -->
  <ellipse cx="150" cy="475" rx="40" ry="60" fill="url(#plantGrad)"/>
  <ellipse cx="170" cy="485" rx="35" ry="45" fill="#24684E"/>
  <ellipse cx="650" cy="475" rx="45" ry="65" fill="url(#plantGrad)"/>
  <ellipse cx="630" cy="485" rx="35" ry="50" fill="#24684E"/>

  <!-- Pot Teras Kiri & Kanan -->
  <rect x="330" y="450" width="18" height="25" fill="#8C6549" rx="1"/>
  <ellipse cx="339" cy="445" rx="14" ry="12" fill="#2D7A5C"/>
  <rect x="452" y="450" width="18" height="25" fill="#8C6549" rx="1"/>
  <ellipse cx="461" cy="445" rx="14" ry="12" fill="#2D7A5C"/>

  <!-- Lampu Dinding Teras -->
  <circle cx="348" cy="385" r="4" fill="#FFE599"/>
  <circle cx="452" cy="385" r="4" fill="#FFE599"/>
</svg>
